<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Cardoso Burguer House | Pedidos online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header"><div class="header-inner">
    <a class="brand" href="/" aria-label="Cardoso Burguer House"><img src="/logo.png" alt="Logo Cardoso" onerror="this.style.display='none'"><span>CARDOSO <strong>BURGUER</strong><small>HOUSE · LORENA SP</small></span></a>
    <label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Buscar no cardápio" aria-label="Buscar no cardápio"></label>
    <nav><button class="nav-active" id="homeBtn">Cardápio</button><button id="ordersBtn">Meus pedidos</button></nav>
  </div></header>
  <div class="layout"><main>
    <section class="intro"><div><span class="eyebrow">CARDOSO BURGUER HOUSE</span><h1>O seu lanche começa aqui.</h1><p>Pão, purê da casa e maionese temperada. Escolha, personalize e peça sem complicação.</p></div></section>
    <div class="section-bar"><h2>Nosso cardápio</h2><span>Preços em R$</span></div><div class="categories" id="categories"></div><div class="products" id="products"></div>
  </main><aside class="cart-panel"><button class="delivery-link" id="deliveryBtn">⌖ <span id="deliveryLabel">Calcular taxa de entrega</span><b>›</b></button><div class="cart-title"><h2>Sua sacola <small id="cartCount">0 itens</small></h2><button id="clearBtn">Limpar</button></div><div class="cart-items" id="cartItems"><p class="empty">Sua sacola está vazia</p></div><div class="totals" id="totals"></div><button class="primary checkout-btn" id="checkoutBtn">Continuar pedido</button></aside></div>
  <button class="mobile-cart" id="mobileCartBtn"><span>Ver sacola <small id="mobileCount">0</small></span><b id="mobileTotal">R$ 0,00</b></button><footer>© Cardoso Burguer House · Lorena, SP</footer>
  <div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle"></h2><button class="close" id="closeBtn" aria-label="Fechar">×</button></div><div id="modalBody"></div></section></div>
  <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <div id="confirmOverlay" class="confirm-overlay" hidden><section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage"><div class="confirm-icon">?</div><h2 id="confirmTitle">Confirmar ação</h2><p id="confirmMessage"></p><div class="confirm-actions"><button type="button" id="confirmCancel" class="confirm-cancel">Cancelar</button><button type="button" id="confirmAccept" class="confirm-accept">Confirmar</button></div></section></div>
  <script src="/socket.io/socket.io.js"></script><script src="script.js"></script>
</body></html>
